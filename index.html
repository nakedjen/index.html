<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ef3f7a" />
  <title>Just Magic: Paris + Bali</title>
  <style>
    :root{
      --bg:#fff7fb; --card:#ffffff; --ink:#211623; --muted:#6f5d70;
      --pink:#ef3f7a; --beet:#8b174e; --gold:#f4b942; --green:#377d5a;
      --line:#f0d8e5; --shadow:0 10px 30px rgba(84,25,64,.12); --r:22px;
    }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#fff7fb 0%,#fffaf3 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.35}
    header{padding:28px 18px 16px;position:sticky;top:0;background:rgba(255,247,251,.92);backdrop-filter:blur(12px);z-index:4;border-bottom:1px solid rgba(240,216,229,.7)}
    h1{margin:0;font-size:34px;letter-spacing:-1.2px}.tag{margin:6px 0 0;color:var(--muted);font-size:15px}.wrap{max-width:880px;margin:0 auto;padding:0 14px 80px}.topbar{display:flex;gap:10px;overflow-x:auto;padding:14px 0 4px}.pill,.btn{border:0;border-radius:999px;padding:12px 16px;background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:750;white-space:nowrap}.pill.active{background:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 18px}.btn{border-radius:18px;text-align:left;min-height:58px}.btn strong{display:block;font-size:16px}.btn span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.btn.beet{background:#fff1f7}.btn.magic{background:#fff4cc}.btn.home{background:#eefaf3}.section-title{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 4px 10px;font-weight:900}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:10px 0}.card h2{font-size:20px;margin:0 0 6px;letter-spacing:-.3px}.card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}.why{font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.a{display:inline-block;text-decoration:none;background:var(--ink);color:#fff;border-radius:999px;padding:9px 12px;font-size:14px;font-weight:800}.a.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.a.gold{background:var(--gold);color:#221506}.a.green{background:var(--green)}.note{background:#fff;border-left:5px solid var(--pink);padding:12px 13px;border-radius:16px;margin:12px 0;color:#41243a}.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}.search{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 14px;font-size:16px;background:#fff;box-shadow:var(--shadow);margin:8px 0 2px}.modebox{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:14px;margin:14px 0}.copy{cursor:pointer}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#211623;color:white;border-radius:999px;padding:11px 16px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:9}.toast.show{opacity:1}.footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}.warning{background:#fff7de;border:1px solid #f2d488;border-radius:18px;padding:12px;margin:10px 0}.list{padding-left:18px;margin:8px 0}.list li{margin:6px 0}@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:20px}header{padding-left:28px}}
  </style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <h1>Just Magic ✨</h1>
    <p class="tag">Paris for Beth. Bali for Nakedjen. Coffee, beets, toilets, snacks, and one tiny portal at a time.</p>
  </div>
</header>

<main class="wrap">
  <div class="modebox">
    <div class="section-title" style="margin-top:0">Where are we?</div>
    <div class="topbar" id="modePills"></div>
    <input id="q" class="search" placeholder="Search: coffee, toilet, beet, salt, firemen, temple…" />
  </div>

  <div class="grid">
    <button class="btn" onclick="setCat('coffee')"><strong>☕ Coffee</strong><span>espresso + room for half-and-half</span></button>
    <button class="btn beet" onclick="setCat('juice')"><strong>🧃 Beets / Juice</strong><span>body rescue, no banana, no avocado</span></button>
    <button class="btn" onclick="setCat('snack')"><strong>🥐 Snacks</strong><span>afternoon delight, market, picnic</span></button>
    <button class="btn" onclick="setCat('toilet')"><strong>🚽 Toilets</strong><span>fast maps search, no shame</span></button>
    <button class="btn magic" onclick="setCat('magic')"><strong>🎭 Magic Today</strong><span>do not sleep on this</span></button>
    <button class="btn home" onclick="setCat('home')"><strong>🏠 Take Me Home</strong><span>anchor points + taxi phrases</span></button>
  </div>

  <section id="quick"></section>
  <div class="section-title" id="resultsTitle">Current magic</div>
  <section id="cards"></section>
  <div class="footer">Reliable by design: curated picks first, map searches second, no fake live engine, no API-key drama.</div>
</main>
<div class="toast" id="toast">Copied</div>

<script>
const modes = {
  parisSolo: {
    label:'Paris Solo', city:'Paris', anchor:'13 Rue Trousseau, 75011 Paris, France',
    map:'https://maps.apple.com/?q=13%20Rue%20Trousseau%2075011%20Paris%20France',
    coffeePhrase:'Bonjour. Je voudrais quatre shots d’espresso sur environ 12 cl de café filtre clair, avec de la place pour du lait, s’il vous plaît.',
    beetPhrase:'Je cherche un jus de betterave frais. Je suis gravement allergique à la banane et allergique à l’avocat. Sans banane, sans avocat, s’il vous plaît.',
    taxiPhrase:'Bonjour, pouvez-vous me conduire au 13 Rue Trousseau, 75011 Paris, s’il vous plaît?'
  },
  parisBeth: {
    label:'Paris with Beth', city:'Paris', anchor:'56 Rue Vieille du Temple, 75004 Paris, France',
    map:'https://maps.apple.com/?q=56%20Rue%20Vieille%20du%20Temple%2075004%20Paris%20France',
    coffeePhrase:'Bonjour. Je voudrais quatre shots d’espresso sur environ 12 cl de café filtre clair, avec de la place pour du lait, s’il vous plaît.',
    beetPhrase:'Je cherche un jus de betterave frais. Je suis gravement allergique à la banane et allergique à l’avocat. Sans banane, sans avocat, s’il vous plaît.',
    taxiPhrase:'Bonjour, pouvez-vous me conduire au 56 Rue Vieille du Temple, 75004 Paris, s’il vous plaît?'
  },
  bali: {
    label:'Bali / Ubud', city:'Ubud', anchor:'Ubud, Bali, Indonesia',
    map:'https://maps.apple.com/?q=Ubud%20Bali%20Indonesia',
    coffeePhrase:'Halo. Saya mau kopi: empat shot espresso di atas kopi hitam light roast, tolong beri ruang untuk susu.',
    beetPhrase:'Saya mencari jus bit segar. Saya alergi berat terhadap pisang dan alergi terhadap alpukat. Tanpa pisang dan tanpa alpukat, tolong.',
    taxiPhrase:'Tolong antar saya kembali ke Ubud. Terima kasih.'
  }
};
let currentMode='parisSolo', currentCat='all';

const items = [
// PARIS SOLO
{mode:'parisSolo',cat:'home',name:'13 Rue Trousseau home anchor',area:'11th / Bastille',why:'Your soft landing nest. Tap when your brain is tired and Paris has too many tiny streets.',map:modes.parisSolo.map,action:'Open home in Maps'},
{mode:'parisSolo',cat:'coffee',name:'Dreamin Man',area:'11th-ish',why:'Small, serious coffee energy. For the first solo cup when your soul is still somewhere between airplanes and croissants.',map:'https://maps.apple.com/?q=Dreamin%20Man%20Paris',action:'Map it'},
{mode:'parisSolo',cat:'coffee',name:'Back in Black',area:'Bastille / 11th',why:'A roomy, reliable specialty coffee option when you need caffeine with a little swagger.',map:'https://maps.apple.com/?q=Back%20in%20Black%20Paris',action:'Map it'},
{mode:'parisSolo',cat:'coffee',name:'Café Méricourt',area:'Oberkampf / 11th',why:'Good coffee, good breakfast, good “I am alone in Paris and very much alive” table energy.',map:'https://maps.apple.com/?q=Cafe%20Mericourt%20Paris',action:'Map it'},
{mode:'parisSolo',cat:'juice',name:'Wild & The Moon Bastille search',area:'Bastille / nearby',why:'Dependable juice/body-rescue button. Confirm every ingredient. Paris loves to hide banana in innocent places.',map:'https://maps.apple.com/?q=Wild%20%26%20The%20Moon%20Bastille%20Paris',action:'Find nearest'},
{mode:'parisSolo',cat:'snack',name:'Marché d’Aligre',area:'12th, close to Rue Trousseau',why:'Do not sleep on this. Fruit, flowers, bread, shouting, softness. Buy something beautiful just for yourself.',map:'https://maps.apple.com/?q=March%C3%A9%20d%27Aligre%20Paris',action:'Map it'},
{mode:'parisSolo',cat:'snack',name:'Blé Sucré',area:'near Aligre',why:'Excellent pastry stop for the “I walked all morning and now require a small French miracle” situation.',map:'https://maps.apple.com/?q=Bl%C3%A9%20Sucr%C3%A9%20Paris',action:'Map it'},
{mode:'parisSolo',cat:'toilet',name:'Fast toilet search from Rue Trousseau',area:'11th',why:'The glamour button. No shame. Only logistics.',map:'https://maps.apple.com/?q=toilettes%20publiques%20near%2013%20Rue%20Trousseau%20Paris',action:'Find toilet'},
{mode:'parisSolo',cat:'magic',name:'July 11: Aligre arrival ritual',area:'Marché d’Aligre',why:'Go in the morning. Buy fruit. Buy flowers. Sit. Do not optimize. Let Paris find you before you start trying to find Paris.',map:'https://maps.apple.com/?q=March%C3%A9%20d%27Aligre%20Paris',action:'Begin'},
{mode:'parisSolo',cat:'magic',name:'July 12: Canal Saint-Martin + Oberkampf wander',area:'10th / 11th',why:'Coffee, water, benches, neighborhood texture. This is not checklist Paris. This is nervous-system Paris.',map:'https://maps.apple.com/?q=Canal%20Saint-Martin%20Paris',action:'Wander'},
{mode:'parisSolo',cat:'magic',name:'July 13: Beth arrives / shift to Marais',area:'Marais',why:'Keep this day soft. Coffee, check in, one beautiful snack, one tiny “Guess what? Paris.”',map:'https://maps.apple.com/?q=56%20Rue%20Vieille%20du%20Temple%2075004%20Paris%20France',action:'Go to Beth HQ'},

// PARIS BETH
{mode:'parisBeth',cat:'home',name:'56 Rue Vieille du Temple home anchor',area:'Marais',why:'Beth birthday headquarters. Tiny streets, deep history, emergency coffee nearby.',map:modes.parisBeth.map,action:'Open home in Maps'},
{mode:'parisBeth',cat:'coffee',name:'Café Nuances Marais',area:'Francs-Bourgeois / very close',why:'Beautiful, dramatic, very close, serious coffee. Excellent “Beth, I have already handled caffeine” move.',map:'https://maps.apple.com/?q=Caf%C3%A9%20Nuances%20Marais%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'coffee',name:'Au Petit Fer à Cheval',area:'Rue Vieille du Temple',why:'Tiny horseshoe bar, old Paris, right there. Not a laptop cave. A sip-and-watch-the-world place.',map:'https://maps.apple.com/?q=Au%20Petit%20Fer%20%C3%A0%20Cheval%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'coffee',name:'Boot Café',area:'Marais',why:'Tiny, iconic, photogenic without trying too hard. Go off-peak or prepare for the pilgrimage line.',map:'https://maps.apple.com/?q=Boot%20Caf%C3%A9%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'juice',name:'Wild & The Moon Charlot',area:'Marais / Charlot',why:'Juice, vegan rescue, body reset. Repeat the allergy spell: no banana, no avocado.',map:'https://maps.apple.com/?q=Wild%20%26%20The%20Moon%20Rue%20Charlot%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'snack',name:'Marché des Enfants Rouges',area:'Marais',why:'Old covered market, grazing, color, chaos with good manners. Beth will think you are a wizard.',map:'https://maps.apple.com/?q=March%C3%A9%20des%20Enfants%20Rouges%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'snack',name:'Place des Vosges picnic',area:'Marais',why:'Buy snacks. Sit under arches or in the square. Let Beth turn 60 inside a painting.',map:'https://maps.apple.com/?q=Place%20des%20Vosges%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'toilet',name:'Fast toilet search from Marais HQ',area:'Marais',why:'The birthday-trip survival button. Beauty is wonderful. Bathrooms are civilization.',map:'https://maps.apple.com/?q=toilettes%20publiques%20near%2056%20Rue%20Vieille%20du%20Temple%20Paris',action:'Find toilet'},
{mode:'parisBeth',cat:'magic',name:'July 13: Fireworks check + boat reality check',area:'Seine / Eiffel Tower',why:'Important: verify the official 2026 fireworks date and your boat reservation. If the date moved, we pivot like velvet professionals.',map:'https://maps.apple.com/?q=Eiffel%20Tower%20Paris',action:'Open Eiffel Tower'},
{mode:'parisBeth',cat:'magic',name:'July 14: Bals des Pompiers',area:'Sévigné Firehouse / Marais search',why:'Firemen’s Ball. Dancing at actual fire stations. After the boat, after the fireworks, after everyone else gives up, you wander toward the music.',map:'https://maps.apple.com/?q=Bal%20des%20Pompiers%20S%C3%A9vign%C3%A9%20Paris',action:'Find the dancing'},
{mode:'parisBeth',cat:'magic',name:'July 15: Musée Carnavalet + Place des Vosges',area:'Marais',why:'Free Paris history museum, then a square that will quietly steal everyone’s heart and refuse to return it.',map:'https://maps.apple.com/?q=Mus%C3%A9e%20Carnavalet%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'magic',name:'July 16: Atelier des Lumières',area:'11th',why:'Immersive art, good rainy-day backup, easy emotional shimmer without requiring six hours of museum stamina.',map:'https://maps.apple.com/?q=Atelier%20des%20Lumi%C3%A8res%20Paris',action:'Map it'},
{mode:'parisBeth',cat:'magic',name:'July 17: Seine goodbye walk',area:'Île Saint-Louis / Seine',why:'One last coffee, one last bridge, one last tiny piece of Paris folded into the pocket before Bali opens the next door.',map:'https://maps.apple.com/?q=%C3%8Ele%20Saint-Louis%20Paris',action:'Map it'},

// BALI
{mode:'bali',cat:'home',name:'Ubud home anchor',area:'Ubud',why:'The app returns to this when the day gets too large. Driver + water + quiet + food.',map:modes.bali.map,action:'Open Ubud'},
{mode:'bali',cat:'coffee',name:'Seniman Coffee Studio',area:'Ubud',why:'Serious Balinese coffee, sit-and-land energy, a strong first Ubud anchor.',map:'https://maps.apple.com/?q=Seniman%20Coffee%20Studio%20Ubud',action:'Map it'},
{mode:'bali',cat:'coffee',name:'F.R.E.A.K Coffee',area:'Ubud',why:'Easy, central, reliable coffee stop. Good “driver is coming soon and I need a cup” button.',map:'https://maps.apple.com/?q=F.R.E.A.K%20Coffee%20Ubud',action:'Map it'},
{mode:'bali',cat:'juice',name:'Alchemy',area:'Penestanan / Ubud',why:'Raw/vegan/juice/body rescue. Confirm no banana, no avocado every time. Trust, but verify with fangs.',map:'https://maps.apple.com/?q=Alchemy%20Ubud',action:'Map it'},
{mode:'bali',cat:'juice',name:'Sayuri Healing Food',area:'Ubud',why:'Raw, vegan, juices, gentle landing. Very Just Magic when your body needs recognizable plants.',map:'https://maps.apple.com/?q=Sayuri%20Healing%20Food%20Ubud',action:'Map it'},
{mode:'bali',cat:'snack',name:'Zest',area:'Penestanan / Ubud',why:'Plant-based, lush, dramatic. Go when you want food and a little bit of treehouse theater.',map:'https://maps.apple.com/?q=Zest%20Ubud',action:'Map it'},
{mode:'bali',cat:'snack',name:'Moksa',area:'Sayan / Ubud',why:'Plant-based garden food. Good for an intentional, slower meal, not a bolt-in-bolt-out snack.',map:'https://maps.apple.com/?q=Moksa%20Ubud',action:'Map it'},
{mode:'bali',cat:'snack',name:'Bali Buda',area:'Ubud',why:'Practical supplies, snacks, health-food basics. Less portal, more sturdy pantry fairy.',map:'https://maps.apple.com/?q=Bali%20Buda%20Ubud',action:'Map it'},
{mode:'bali',cat:'toilet',name:'Fast toilet search from Ubud',area:'Ubud',why:'Bathrooms, because enlightenment still has a bladder.',map:'https://maps.apple.com/?q=toilet%20near%20Ubud%20Bali',action:'Find toilet'},
{mode:'bali',cat:'magic',name:'Portal: Kusamba sea salt',area:'Klungkung coast',why:'Traditional sea salt, black volcanic sand, ocean labor, the opposite of souvenir nonsense. Go respectfully, buy directly, listen more than you speak.',map:'https://maps.apple.com/?q=Kusamba%20Sea%20Salt%20Bali',action:'Map it'},
{mode:'bali',cat:'magic',name:'Portal: Tirta Empul purification',area:'Tampaksiring',why:'Water, prayer, humility. Do this with local guidance, proper dress, and no spiritual-tourist grabby hands.',map:'https://maps.apple.com/?q=Tirta%20Empul%20Bali',action:'Map it'},
{mode:'bali',cat:'magic',name:'Portal: Gunung Kawi Sebatu',area:'Sebatu',why:'A quieter water temple option. Go early. Bring sarong. Let the place be itself.',map:'https://maps.apple.com/?q=Pura%20Gunung%20Kawi%20Sebatu',action:'Map it'},
{mode:'bali',cat:'magic',name:'Portal: Sidemen valley day',area:'East Bali',why:'Rice fields, weaving, mountains, slower breath. This is driver-day medicine.',map:'https://maps.apple.com/?q=Sidemen%20Bali',action:'Map it'},
{mode:'bali',cat:'magic',name:'Portal: Penglipuran village',area:'Bangli',why:'Traditional village architecture and community rhythm. Go gently. Do not turn people into scenery.',map:'https://maps.apple.com/?q=Penglipuran%20Village%20Bali',action:'Map it'},
{mode:'bali',cat:'magic',name:'Portal: Bali Kite Festival / Sanur sky',area:'Sanur / Padanggalak',why:'July and August are kite season. Giant kites, sky medicine, village teams, gamelan, scale. Ask your driver what is happening that week.',map:'https://maps.apple.com/?q=Padanggalak%20Beach%20Sanur%20Bali',action:'Map it'},
{mode:'bali',cat:'magic',name:'August 7–8: Ubud Village Jazz Festival',area:'Sthala Ubud',why:'Two evenings of jazz in Ubud. A very different kind of ceremony, with brass instead of incense.',map:'https://maps.apple.com/?q=Sthala%20Ubud%20Bali',action:'Map venue'}
];

function mapsSearch(query){return `https://maps.apple.com/?q=${encodeURIComponent(query)}`}
function toast(msg='Copied'){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}
function copyText(text){navigator.clipboard?.writeText(text).then(()=>toast()).catch(()=>toast('Copy failed'))}
function setCat(cat){currentCat=cat;render()}
function setMode(m){currentMode=m;currentCat='all';document.getElementById('q').value='';render()}
function nearMe(kind){
  const mode=modes[currentMode];
  const q={coffee:'specialty coffee',juice:'fresh beet juice OR juice bar',snack:'bakery market snacks',toilet:'public toilet',magic:'things to do'}[kind]||kind;
  if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    window.open(`https://maps.apple.com/?q=${encodeURIComponent(q)}&ll=${latitude},${longitude}`,'_blank');
  },()=>{window.open(mapsSearch(`${q} near ${mode.anchor}`),'_blank')},{timeout:3500});
  } else window.open(mapsSearch(`${q} near ${mode.anchor}`),'_blank');
}
function renderPills(){
  const el=document.getElementById('modePills'); el.innerHTML='';
  Object.keys(modes).forEach(k=>{const b=document.createElement('button');b.className='pill '+(k===currentMode?'active':'');b.textContent=modes[k].label;b.onclick=()=>setMode(k);el.appendChild(b)})
}
function renderQuick(){
  const m=modes[currentMode];
  document.getElementById('quick').innerHTML=`
    <div class="note"><strong>${m.label} anchor:</strong> ${m.anchor}</div>
    <div class="actions">
      <a class="a green" href="${m.map}" target="_blank">🏠 Home</a>
      <button class="a light copy" onclick="copyText('${m.coffeePhrase.replaceAll("'","\\'")}')">Copy coffee order</button>
      <button class="a light copy" onclick="copyText('${m.beetPhrase.replaceAll("'","\\'")}')">Copy beet / allergy request</button>
      <button class="a light copy" onclick="copyText('${m.taxiPhrase.replaceAll("'","\\'")}')">Copy taxi phrase</button>
      <button class="a gold" onclick="nearMe('toilet')">Fast toilet near me</button>
    </div>
    <div class="warning small"><strong>Allergy spell:</strong> Banana = no. Avocado = no. Repeat every time, even when everyone seems very nice.</div>
  `;
}
function render(){
  renderPills(); renderQuick();
  const q=document.getElementById('q').value.toLowerCase().trim();
  let out=items.filter(x=>x.mode===currentMode);
  if(currentCat!=='all') out=out.filter(x=>x.cat===currentCat);
  if(q) out=out.filter(x=>[x.name,x.area,x.why,x.cat].join(' ').toLowerCase().includes(q));
  document.getElementById('resultsTitle').textContent = currentCat==='all'?'Current magic':currentCat.toUpperCase();
  const cards=document.getElementById('cards'); cards.innerHTML='';
  if(!out.length){cards.innerHTML='<div class="card"><h2>No exact match</h2><p class="why">Try coffee, beet, toilet, salt, firemen, jazz, temple, market, or clear the search. The tiny wand is picky, not broken.</p></div>';return}
  out.forEach(x=>{
    const c=document.createElement('article');c.className='card';
    c.innerHTML=`<h2>${x.name}</h2><div class="meta">${x.area} · ${x.cat}</div><div class="why">${x.why}</div><div class="actions"><a class="a" href="${x.map}" target="_blank">${x.action||'Open Maps'}</a><button class="a light" onclick="nearMe('${x.cat}')">Find more near me</button></div>`;
    cards.appendChild(c);
  });
}
document.getElementById('q').addEventListener('input',render);
render();
</script>
</body>
</html>
